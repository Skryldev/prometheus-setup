global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "go_app" # If didn't run go file yet, will get Error in => Status Target
    static_configs:
      - targets: ["172.17.0.1:8080"]  # ip addr show docker0

  # Prometheus خودش
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
